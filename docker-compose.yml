version: "3.9"

services:
  mimo-hr:
    build: .
    ports:
      - "8000:8000"
    environment:
      - MIMO_HR_DEBUG=false
      - MIMO_HR_LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
